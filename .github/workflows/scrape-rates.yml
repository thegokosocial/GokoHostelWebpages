name: Scrape Booking.com Rates

on:
  workflow_dispatch:
    inputs:
      scrapeId:
        description: 'D1 scrape ID to update with results'
        required: true
      city:
        description: 'City to search'
        required: true
        default: 'Gokarna'
      startDate:
        description: 'Start date (YYYY-MM-DD)'
        required: true
      endDate:
        description: 'End date (YYYY-MM-DD)'
        required: true
      propertyType:
        description: 'Property type filter'
        required: false
        default: 'hostels'
      proxyUrl:
        description: 'Proxy URL (optional)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require API callback secrets
        env:
          API_URL: ${{ secrets.API_URL }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$API_PASSWORD" ]; then
            echo "API_URL and API_PASSWORD repository secrets are required so the scraper can update D1."
            echo "API_PASSWORD must match the Worker ADMIN_PASSWORD (admin_only action)."
            exit 1
          fi

      - name: Verify API callback auth
        env:
          API_URL: ${{ secrets.API_URL }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
        run: |
          node <<'NODE'
          const url = process.env.API_URL;
          const password = process.env.API_PASSWORD;
          (async () => {
            const res = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ password, action: "getLatestRateScrape", city: "Gokarna" }),
            });
            const text = await res.text();
            if (!res.ok) {
              console.error(`Callback auth failed: ${res.status} ${text.slice(0, 400)}`);
              console.error("Set GitHub secret API_PASSWORD to the live Worker ADMIN_PASSWORD, and API_URL to …/api/admin/checkins");
              process.exit(1);
            }
            console.log("Callback auth OK");
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Test price extraction and result handling
        run: |
          node scripts/test-booking-rate-parser.js
          node scripts/test-rate-scrape-flow.js
          node scripts/test-rate-scrape-callback.js

      - name: Run scraper
        env:
          SCRAPE_ID: ${{ github.event.inputs.scrapeId }}
          CITY: ${{ github.event.inputs.city }}
          START_DATE: ${{ github.event.inputs.startDate }}
          END_DATE: ${{ github.event.inputs.endDate }}
          PROPERTY_TYPE: ${{ github.event.inputs.propertyType }}
          API_URL: ${{ secrets.API_URL }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
          PROXY_URL: ${{ github.event.inputs.proxyUrl || secrets.PROXY_URL }}
        run: node scripts/scrape-booking-rates.js

      - name: Upload scrape evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: /tmp/scrape-*
          retention-days: 7
